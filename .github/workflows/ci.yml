name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax
        run: |
          for f in assets/js/*.js; do
            node --check "$f"
          done

      - name: Run unit tests
        run: node --test tests/*.test.js
