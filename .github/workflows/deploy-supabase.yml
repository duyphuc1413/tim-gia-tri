name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: mqjxqincygmmoylathcx
      SITE_URL: https://duyphuc1413.github.io/tim-gia-tri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v3.4.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase db push --remote --include-all --yes

      - name: Set SITE_URL secret
        run: supabase secrets set --remote="$SUPABASE_PROJECT_REF" --yes SITE_URL="$SITE_URL"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-payment --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy delete-account --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy payos-webhook --no-verify-jwt --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy sms-hook --no-verify-jwt --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy send-reminders --no-verify-jwt --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy ai-analysis --remote="$SUPABASE_PROJECT_REF" --yes
